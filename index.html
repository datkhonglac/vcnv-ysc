<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vượt chướng ngại vật</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: sân khấu truyền hình, sôi động nhưng gọn – MC điều khiển trên máy chiếu
   IDEA: bàn chơi "Vượt chướng ngại vật" của Olympia: người lữ hành mang balo ở trung tâm, 4 biểu tượng hành trình ở 4 góc
   PICTURE: chính bàn chơi – ảnh bị che bởi 5 mảnh, hàng chữ cái phát sáng khi mở
   COLOUR and TYPE: xanh lá #1f5c34 → #03120a và vàng kim #c9a23a theo logo YSC, vàng #ffd23f cho đúng, đỏ #ff4d5e cho sai; Be Vietnam Pro
   LAYOUT: lưới 2×2 kiểu Olympia (ảnh | hàng ngang / câu hỏi | trả lời), thanh điều khiển MC phía dưới; xếp dọc dưới 760px */
:root{color-scheme:dark;--bg1:#1f5c34;--bg2:#03120a;--panel:#0f3320;--panel2:#0a2617;--edge:#c9a23a;--glow:#f5d77a;--ink:#f2f7ff;--mute:#c9d8b4;--gold:#ffd23f;--bad:#ff4d5e;--ok:#3be08a}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;color:var(--ink);font:16px/1.45 "Be Vietnam Pro",system-ui,sans-serif;overflow-x:clip;
 background:radial-gradient(1200px 700px at 30% 0%,#2f8a45 0%,transparent 60%),radial-gradient(900px 600px at 100% 100%,#1a5c2e 0%,transparent 55%),linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.25;background-image:radial-gradient(#d4af37 1.2px,transparent 1.4px);background-size:22px 22px;mask-image:linear-gradient(90deg,#000 0,transparent 18%,transparent 82%,#000 100%)}
.wrap{max-width:1360px;margin:0 auto;padding:14px clamp(10px,2vw,24px) 20px;position:relative;z-index:1}
.wm{position:fixed;left:50%;top:50%;width:min(78vw,1000px);transform:translate(-50%,-46%);opacity:.2;filter:saturate(.7);pointer-events:none;user-select:none;z-index:0}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
header h1{margin:0;font-size:clamp(18px,2.2vw,26px);font-weight:900;letter-spacing:.01em}
header small{color:var(--mute);font-weight:500}
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.panel{position:relative;background:linear-gradient(180deg,#0f3320b8,#0a2617c4);border:2px solid var(--edge);border-radius:6px;box-shadow:0 0 0 1px #03100a inset,0 10px 30px #0006,0 0 22px #d4af3733 inset}
.panel.cut{clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px))}
/* ---------- picture ---------- */
.pic{aspect-ratio:16/9;overflow:hidden;padding:0}
.pic img,.pic svg.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover{position:absolute;display:flex;padding:3% 5%;font-weight:900;font-size:clamp(26px,4.4vw,58px);color:#fff;text-shadow:0 2px 0 #0008;
 background:linear-gradient(150deg,#13432a,#0a2a19 70%);border:2px solid #b8923a;transition:opacity .9s ease,transform .9s ease}
.cover.q1{left:0;top:0;width:50%;height:50%;align-items:flex-start;justify-content:center}
.cover.q2{right:0;top:0;width:50%;height:50%;align-items:flex-start;justify-content:center}
.cover.q3{right:0;bottom:0;width:50%;height:50%;align-items:flex-end;justify-content:center}
.cover.q4{left:0;bottom:0;width:50%;height:50%;align-items:flex-end;justify-content:center}
.cover.c5{left:29%;top:29%;width:42%;height:42%;z-index:2;align-items:center;justify-content:center;background:linear-gradient(150deg,#18552f,#0c3320);box-shadow:0 0 0 2px #0a2617,0 8px 24px #0008}
.cover.open{opacity:0;transform:scale(1.04);pointer-events:none}
.cover.picked{background:linear-gradient(150deg,#3a9a50,#1a5c2e);box-shadow:0 0 30px var(--glow) inset}
/* ---------- rows ---------- */
.rows{padding:0;display:flex;flex-direction:column}
.title{align-self:flex-end;margin:-2px -2px 0 0;padding:8px 22px 8px 26px;font-weight:800;font-size:clamp(13px,1.6vw,20px);background:linear-gradient(90deg,#2f8a45,#1a5c2e);border:2px solid #f5dc8a;clip-path:polygon(14px 0,100% 0,100% 100%,0 100%);white-space:nowrap}
.rowlist{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;gap:6px;padding:10px 12px 14px}
.row{--c:clamp(20px,2.8vw,42px);display:flex;align-items:center;gap:8px;padding:3px 4px;border-radius:999px;cursor:pointer;border:0;background:none;color:inherit;font:inherit;text-align:left;width:100%}
.row:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.dots{flex:1;display:flex;gap:clamp(3px,.5vw,7px);flex-wrap:wrap}
.dot{width:var(--c);height:var(--c);border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:calc(var(--c)*.5);color:#062a12;
 background:radial-gradient(circle at 35% 30%,#dff5e1 0 12%,#56b463 40%,#2a7a3a 75%,#0f3d1d 100%);box-shadow:0 0 0 2px #0a2617,0 2px 4px #0008 inset;transition:background .4s,transform .4s}
.row.picked .dot{background:radial-gradient(circle at 35% 30%,#fff 0 12%,#d8f7b8 40%,#86d46e 75%,#3c9a3a 100%);box-shadow:0 0 0 2px #0a2617,0 0 14px var(--glow)}
.row.solved .dot{background:radial-gradient(circle at 35% 30%,#fffbe0 0 14%,#ffe57a 45%,#f5b800 100%);color:#3a2500;transform:rotateY(360deg)}
.row.failed .dot{background:radial-gradient(circle at 35% 30%,#8a93a8 0 10%,#4a5470 50%,#2a2440 100%);box-shadow:0 0 0 2px #0a2617}
.cnt{flex:none;font-weight:800;font-size:calc(var(--c)*.4);line-height:1;color:var(--gold);background:#06180dcc;border:1.5px solid var(--edge);border-radius:999px;padding:.45em .8em;white-space:nowrap;font-variant-numeric:tabular-nums}
.row.failed .cnt{opacity:.5}
.num{flex:none;width:calc(var(--c)*.9);height:calc(var(--c)*.9);border-radius:8px;display:grid;place-items:center;font-weight:900;background:#0a2617;border:2px solid #c9a23a;font-size:calc(var(--c)*.45)}
.row.picked .num{background:var(--gold);color:#2b1c00;border-color:#fff3b0}
.row.failed .num{opacity:.5}
/* ---------- question ---------- */
.q{padding:clamp(14px,2vw,22px);min-height:200px;display:flex;flex-direction:column;gap:10px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--mute);font-weight:700;font-size:14px}
.qtext{font-size:clamp(17px,1.75vw,23px);font-weight:700;line-height:1.4;text-wrap:pretty}
.qtext.empty{color:var(--mute);font-weight:500}
.timer{height:8px;border-radius:9px;background:#03100a;overflow:hidden;margin-top:auto}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gold),#ff8a3d);transform-origin:left;transition:transform .2s linear}
.sec{font-variant-numeric:tabular-nums;font-size:22px;color:var(--gold);font-weight:900;min-width:2.5ch;text-align:right}
/* ---------- answer ---------- */
.ans{padding:clamp(14px,2vw,22px);display:flex;flex-direction:column;gap:12px}
.ans label{font-weight:700;color:var(--mute);font-size:14px}
.field{display:flex;gap:8px;flex-wrap:wrap}
input[type=text]{flex:1 1 200px;font:800 clamp(18px,2vw,24px)/1.2 "Be Vietnam Pro",system-ui,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:#04170c;border:2px solid #c9a23a;border-radius:6px;padding:12px 14px;min-height:52px}
input[type=text]:focus{outline:none;border-color:var(--glow);box-shadow:0 0 0 3px #f5d77a55}
input[type=text]:disabled{opacity:.5}
button.b{font:800 15px/1 "Be Vietnam Pro",system-ui,sans-serif;color:#fff;border:2px solid #f5dc8a;background:linear-gradient(180deg,#2f8a45,#1a5c2e);border-radius:6px;padding:0 18px;min-height:46px;cursor:pointer;white-space:nowrap}
button.b:hover{filter:brightness(1.12)}button.b:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.b:disabled{opacity:.45;cursor:not-allowed;filter:none}
button.b.gold{background:linear-gradient(180deg,#ffd23f,#f0a500);color:#2b1c00;border-color:#fff3b0}
button.b.ghost{background:#0a2617;border-color:#c9a23a}
button.b.red{background:linear-gradient(180deg,#ff6474,#d62839);border-color:#ffb3bb}
.msg{min-height:30px;font-weight:800;font-size:clamp(16px,1.6vw,20px)}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}.msg.info{color:var(--mute)}
.shake{animation:sh .45s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.sep{height:1px;background:linear-gradient(90deg,transparent,#c9a23a,transparent);margin:2px 0}
/* ---------- host bar ---------- */
.host{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px}
.host .sp{flex:1}
.host .file{position:relative;overflow:hidden}
.host .file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.hint{color:var(--mute);font-size:13px}
/* ---------- win ---------- */
.win{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:#020d07cc;backdrop-filter:blur(4px)}
.win.show{display:grid}
.win div{text-align:center;padding:30px 40px}
.win p{margin:0;color:var(--mute);font-weight:700;font-size:clamp(16px,2vw,22px)}
.win h2{margin:.2em 0;font-size:clamp(46px,9vw,120px);font-weight:900;line-height:1.05;color:var(--gold);text-shadow:0 0 40px #ffd23f88}
@media(max-width:760px){.board{grid-template-columns:minmax(0,1fr)}.row{--c:clamp(20px,7.4vw,40px)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

   <img id="userImg" alt="" hidden>
   <div class="cover q1" data-p="1">1</div>
   <div class="cover q2" data-p="2">2</div>

   <div class="cover q4" data-p="4">4</div>
   <div class="cover c5" data-p="5">5</div>
  </section>

  <section class="panel rows" aria-label="Các hàng ngang">
   <div class="title" id="kwTitle">CHƯỚNG NGẠI VẬT CÓ 9 CHỮ CÁI</div>
   <div class="rowlist" id="rowlist"></div>
  </section>

  <section class="panel cut q" aria-live="polite">
   <div class="qhead"><span id="qlabel"></span><span class="sec" id="sec"></span></div>
   <div class="qtext empty" id="qtext"></div>
   <div class="timer"><i id="bar"></i></div>
  </section>

  <section class="panel cut ans">
   <label for="answer">Đáp án hàng ngang</label>
   <div class="field">
    <input type="text" id="answer" autocomplete="off" spellcheck="false" placeholder="Nhập đáp án…" disabled>
    <button class="b gold" id="checkBtn" disabled>Kiểm tra</button>
   </div>
   <div class="msg info" id="msg"></div>
   <div class="sep"></div>
   <label for="kw">Trả lời chướng ngại vật</label>
   <div class="field">
    <input type="text" id="kw" autocomplete="off" spellcheck="false" placeholder="Từ khóa…">
    <button class="b red" id="kwBtn">Trả lời CNV</button>
   </div>
   <div class="msg info" id="kwMsg"></div>
  </section>
 </main>

 <section class="panel host" aria-label="Điều khiển của MC">
  <button class="b" id="timeBtn" disabled>Bắt đầu 15s</button>
  <span class="sp"></span>
  <label class="b ghost file" style="display:inline-flex;align-items:center">Đổi ảnh nền<input type="file" id="imgFile" accept="image/*"></label>
  <button class="b ghost" id="fsBtn">Toàn màn hình</button>
  <button class="b ghost" id="resetBtn">Chơi lại</button>
 </section>
</div>

<div class="win" id="win" role="dialog" aria-label="Kết quả"><div><p>Từ khóa chướng ngại vật</p><h2 id="winWord"></h2><button class="b gold" id="winClose">Đóng</button></div></div>

<script>
{
/* ====== BỘ CÂU HỎI – sửa tại đây ====== */
const KEYWORD = "Hành Trang";
const TIME = 15;
const ROWS = [
 {q:'Tại Việt Nam, muốn hành nghề môi giới, phân tích tài chính hay quản lý quỹ tại công ty chứng khoán, cá nhân bắt buộc phải có loại "giấy thông hành" do Ủy ban Chứng khoán Nhà nước cấp. Đó là gì?', a:"Chứng chỉ"},
 {q:'Mười năm trước, mở tài khoản chứng khoán phải đến tận quầy ký giấy tờ. Nay chỉ cần vài phút trên điện thoại, xác thực bằng khuôn mặt. Yếu tố nào đã tạo nên sự thay đổi này?', a:"Công nghệ"},
 {q:'Để trở thành một chuyên gia phân tích hay tư vấn đầu tư nhạy bén, bên cạnh kiến thức hàn lâm từ sách vở, người làm nghề cần phải trải qua nhiều chu kỳ thăng trầm của thị trường để tích lũy khối "tài sản vô hình" này.', a:"Kinh nghiệm"},
 {q:'Khi lợi ích kinh doanh của cá nhân/công ty xảy ra xung đột với lợi ích của khách hàng, người làm tài chính cần dùng yếu tố nghề nghiệp nào để đưa ra cách xử lý đúng đắn nhất?', a:"Đạo đức"},
 {q:'Trong bối cảnh thị trường tài chính biến động nhanh, việc liên tục cập nhật, dự báo yếu tố này (đặc biệt là vĩ mô) đóng vai trò quyết định đối với sự thăng tiến trong nghề.', a:"Kiến thức"}
];
/* ====================================== */

const $ = id => document.getElementById(id);
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[đĐ]/g,"d").replace(/[^a-zA-Z0-9]/g,"").toUpperCase();
const letters = s => Array.from(s.normalize("NFC").toUpperCase().replace(/\s+/g,""));
const st = ROWS.map(() => "idle"); // idle | solved | failed
let cur = -1, left = TIME, tick = null, done = false, audio = null;

$("kwTitle").textContent = `CHƯỚNG NGẠI VẬT CÓ ${letters(KEYWORD).length} CHỮ CÁI`;

function render(){
 $("rowlist").innerHTML = ROWS.map((r,i) => {
  const L = letters(r.a), show = st[i]==="solved";
  const cls = ["row", i===cur?"picked":"", st[i]!=="idle"?st[i]:""].join(" ");
  return `<button class="${cls}" data-i="${i}" aria-label="Hàng ${i+1}, ${L.length} chữ cái"><span class="num">${i+1}</span><span class="dots">${L.map(c=>`<span class="dot">${show?c:""}</span>`).join("")}</span><span class="cnt">${L.length} chữ</span></button>`;
 }).join("");
 document.querySelectorAll(".cover").forEach(c => {
  const i = +c.dataset.p - 1;
  c.classList.toggle("open", done || st[i]==="solved");
  c.classList.toggle("picked", i===cur && st[i]==="idle");
 });
 const active = cur>=0 && st[cur]==="idle" && !done;
 $("answer").disabled = $("checkBtn").disabled = $("timeBtn").disabled = !active;
}

function beep(f, d=.15, type="sine", v=.15){
 try{
  audio = audio || new (window.AudioContext||window.webkitAudioContext)();
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.value = f; g.gain.value = v;
  o.connect(g); g.connect(audio.destination);
  g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + d);
  o.start(); o.stop(audio.currentTime + d);
 }catch(e){}
}
const okSound = () => [523,659,784,1046].forEach((f,k)=>setTimeout(()=>beep(f,.22,"triangle"),k*110));
const badSound = () => { beep(180,.35,"sawtooth",.12); setTimeout(()=>beep(140,.4,"sawtooth",.12),180); };

function say(el, text, kind){ const m=$(el); m.textContent=text; m.className="msg "+kind; }

function stopTimer(){ clearInterval(tick); tick=null; }
function setBar(){ $("bar").style.transform = `scaleX(${left/TIME})`; $("sec").textContent = tick||left<TIME ? left : ""; }

function pick(i){
 if(done || i<0 || i>=ROWS.length) return;
 stopTimer(); cur = i; left = TIME; setBar(); $("sec").textContent="";
 $("qlabel").textContent = `Hàng ngang số ${i+1} · ${letters(ROWS[i].a).length} chữ cái`;
 const q = $("qtext"); q.classList.remove("empty"); q.textContent = ROWS[i].q;
 $("answer").value = ""; say("msg","","info");
 if(st[i]==="solved") say("msg","Đáp án: "+ROWS[i].a.toUpperCase(),"ok");
 if(st[i]==="failed") say("msg","Hàng này đã đóng.","bad");
 beep(880,.08);
 render();
 if(st[i]==="idle") $("answer").focus();
}

function solve(){
 st[cur]="solved"; stopTimer();
 say("msg",`Chính xác! ${ROWS[cur].a.toUpperCase()}`,"ok"); okSound(); render();
 if(st.every(s=>s!=="idle")) say("kwMsg","Đã mở hết các hàng – mời trả lời chướng ngại vật!","info");
}

function check(){
 if(cur<0 || st[cur]!=="idle") return;
 const v = $("answer").value.trim();
 if(!v) return;
 if(norm(v)===norm(ROWS[cur].a)) solve();
 else { say("msg",`"${v.toUpperCase()}" – chưa chính xác`,"bad"); badSound(); const f=$("answer"); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); f.select(); }
}

function startTimer(){
 if(cur<0 || st[cur]!=="idle") return;
 stopTimer(); left = TIME;
 tick = setInterval(() => {
  left--; setBar();
  if(left<=5 && left>0) beep(660,.08,"square",.08);
  if(left<=0){ stopTimer(); $("sec").textContent="0"; say("msg","Hết giờ!","bad"); beep(300,.6,"square",.12); }
 },1000);
 setBar(); $("sec").textContent = left; beep(990,.1);
 $("answer").focus();
}

function guessKw(){
 const v = $("kw").value.trim(); if(!v || done) return;
 if(norm(v)===norm(KEYWORD)){
  done = true; stopTimer();
  say("kwMsg","Chính xác! Chướng ngại vật đã được giải.","ok");
  $("winWord").textContent = KEYWORD.toUpperCase(); $("win").classList.add("show");
  okSound(); setTimeout(okSound,500); render();
 } else {
  say("kwMsg",`"${v.toUpperCase()}" – sai từ khóa`,"bad"); badSound();
  const f=$("kw"); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); f.select();
 }
}

$("rowlist").addEventListener("click", e => { const b=e.target.closest(".row"); if(b) pick(+b.dataset.i); });
document.querySelectorAll(".cover").forEach(c => c.addEventListener("click", () => pick(+c.dataset.p-1)));
$("checkBtn").addEventListener("click", check);
$("answer").addEventListener("keydown", e => { if(e.key==="Enter") check(); });
$("kwBtn").addEventListener("click", guessKw);
$("kw").addEventListener("keydown", e => { if(e.key==="Enter") guessKw(); });
$("timeBtn").addEventListener("click", startTimer);
$("winClose").addEventListener("click", () => $("win").classList.remove("show"));
$("fsBtn").addEventListener("click", () => {
 try{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){}
});
let armed = null;
$("resetBtn").addEventListener("click", () => {
 const b=$("resetBtn");
 if(!armed){ b.textContent="Bấm lần nữa để xác nhận"; armed=setTimeout(()=>{armed=null;b.textContent="Chơi lại";},3000); return; }
 clearTimeout(armed); armed=null; b.textContent="Chơi lại";
 st.fill("idle"); cur=-1; done=false; stopTimer(); left=TIME; setBar(); $("sec").textContent="";
 $("qlabel").textContent="";
 const q=$("qtext"); q.classList.add("empty"); q.textContent="";
 $("answer").value=""; $("kw").value=""; say("msg","","info"); say("kwMsg","","info"); render();
});
$("imgFile").addEventListener("change", e => {
 const f = e.target.files && e.target.files[0]; if(!f) return;
 const img = $("userImg"); img.src = URL.createObjectURL(f); img.hidden = false; $("art").style.display="none";
});
document.addEventListener("keydown", e => {
 if(e.target.matches("input")) return;
 const n = +e.key; if(n>=1 && n<=ROWS.length) pick(n-1);
});

render(); setBar();
}
</script>
